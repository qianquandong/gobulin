# XcodeGen 工程定义（锁定 XcodeGen 2.45.4，见 docs/production/build.md）。
# 生成命令（仓库根目录）：xcodegen generate --spec ios/project.yml
# 生成结果 ios/GoblinForge.xcodeproj 一并提交；CI 重新生成并比对，防止手改漂移。
name: GoblinForge
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configs:
  Debug: debug
  Prototype: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # Team 由负责人在签名前提供；不在仓库伪造。模拟器构建不需要签名。
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    Prototype:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "PROTOTYPE"
packages:
  GoblinForgeCore:
    path: ../Packages/GoblinForgeCore
targets:
  GoblinForge:
    type: application
    platform: iOS
    sources:
      - path: GoblinForge
        excludes:
          - "Resources/**"
      - path: GoblinForge/Resources
        buildPhase: resources
    dependencies:
      - package: GoblinForgeCore
        product: GoblinForgeCore
    info:
      path: GoblinForge/Info.plist
      properties:
        CFBundleDisplayName: Goblin Forge
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 测试日志（JSONL）可通过“文件” App 导出，见 PRD 0.5
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        # 占位 Bundle ID（example.com 保留域名），真机签名前由负责人确定真实值。
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GoblinForge
        PRODUCT_NAME: GoblinForge
        # 仅 iPhone。XcodeGen 的 application 预设在 target 层设 "1,2"，会覆盖工程层设置，必须在这里再写一次
        # （CI run 38162394597 的二进制检查发现 UIDeviceFamily = [1, 2]）
        TARGETED_DEVICE_FAMILY: "1"
  GoblinForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoblinForgeTests
    dependencies:
      - target: GoblinForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GoblinForge.tests
        GENERATE_INFOPLIST_FILE: "YES"
  GoblinForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GoblinForgeUITests
    dependencies:
      - target: GoblinForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GoblinForge.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  GoblinForge:
    build:
      targets:
        GoblinForge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GoblinForgeTests
        - GoblinForgeUITests
    profile:
      config: Prototype
    analyze:
      config: Debug
    archive:
      config: Prototype
